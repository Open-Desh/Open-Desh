<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 170 40" fill="none">
  <defs>
    <linearGradient id="orbitGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2563eb" />
      <stop offset="50%" stop-color="#3b82f6" />
      <stop offset="100%" stop-color="#1d4ed8" />
    </linearGradient>
    <linearGradient id="ringGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#60a5fa" />
      <stop offset="100%" stop-color="#2563eb" />
    </linearGradient>
  </defs>
  
  <!-- Orbit Icon Mark -->
  <g transform="translate(4, 4)">
    <circle cx="16" cy="16" r="8" fill="url(#orbitGrad)" />
    <circle cx="13" cy="13" r="3" fill="#ffffff" opacity="0.6" />
    <ellipse cx="16" cy="16" rx="14" ry="5.5" stroke="url(#ringGrad)" stroke-width="2" transform="rotate(-30 16 16)" stroke-dasharray="28 4 6 4" stroke-linecap="round" />
    <ellipse cx="16" cy="16" rx="14" ry="5.5" stroke="url(#ringGrad)" stroke-width="1.5" transform="rotate(35 16 16)" stroke-opacity="0.7" stroke-linecap="round" />
    <circle cx="28" cy="10" r="2" fill="#2563eb" />
    <circle cx="5" cy="22" r="1.5" fill="#3b82f6" />
  </g>

  <!-- Typography: OPEN NATION -->
  <text x="44" y="22" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Plus Jakarta Sans', sans-serif" font-weight="900" font-size="15" fill="#0f172a" letter-spacing="-0.5">
    OPEN
  </text>
  <text x="92" y="22" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Plus Jakarta Sans', sans-serif" font-weight="900" font-size="15" fill="#2563eb" letter-spacing="-0.3">
    NATION
  </text>
  <text x="44" y="32" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Plus Jakarta Sans', sans-serif" font-weight="700" font-size="7" fill="#64748b" letter-spacing="1.8">
    CIVIC GOVERNANCE
  </text>
</svg>
